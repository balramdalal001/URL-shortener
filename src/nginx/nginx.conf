events {}

http {

    upstream url_shortener_api {
        server api:3000;  #for single instance


        # for multiple instances of the backend.
        # server api1:3000;
        # server api2:3000;
        # server api3:3000;
    }

    # Nginx, your backend Node.js application is available at api:3000. api will be the Docker Compose (container) service name.

    server {

        listen 80;

        location / {
            proxy_pass http://url_shortener_api;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}