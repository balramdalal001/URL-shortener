services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: url-shortener-api

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://postgres:localdev@postgres:5432/balram

      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  postgres:
    image: postgres:16-alpine

    container_name: url-shortener-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: balram

    ports:
      - "5433:5432"

    
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d balram"
        ]

      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine

    container_name: url-shortener-redis

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 5s
      timeout: 5s
      retries: 5  


volumes:
  postgres_data:
  redis_data: